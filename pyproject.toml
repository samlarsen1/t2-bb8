[project]
name = "t2bb8"
version = "0.1.0"
description = "Harvests Trading212 instrument and exchange metadata into ./data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "structlog>=24.1",
]

[project.scripts]
t2bb8-harvest = "t2bb8.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ruff>=0.4",
    "pip-audit>=2.9",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/t2bb8"]

[tool.uv]
# Supply-chain cooldown: ignore package versions published in the last 7 days
exclude-newer = "7 days"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.bandit]
exclude_dirs = [".venv"]

[tool.bandit.assert_used]
skips = ["*/tests/*", "*/test_*.py"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
